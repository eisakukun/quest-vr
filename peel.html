<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界をはがす</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
    /* パソコンで見たときの「現実」の代わり。Questではここにパススルー（本物の部屋）が見える */
    body {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 80px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 80px),
        linear-gradient(#8a8f96, #5b6068 55%, #3d4046);
    }
    #real {
      position: absolute; left: 0; right: 0; bottom: 130px; text-align: center;
      color: rgba(255,255,255,.45); font-size: 16px; letter-spacing: .1em; pointer-events: none;
    }
    canvas { position: absolute; inset: 0; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.62); color: #fff; padding: 12px 16px;
      border-radius: 12px; font-size: 14px; line-height: 1.7; max-width: 82vw;
    }
    #hud b { color: #5dff8f; }
    #enter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: #22dd66; color: #001a08; border: 0; border-radius: 999px;
      padding: 14px 28px; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    #enter[disabled] { background: #555; color: #bbb; cursor: default; }
    #hintOpt {
      position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%); z-index: 10; white-space: nowrap;
      background: rgba(0,0,0,.62); color: #cfe; padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
    }
    #hintOpt input { accent-color: #22dd66; vertical-align: middle; }
    #resetBtn {
      position: absolute; bottom: 20px; right: 16px; z-index: 10;
      background: #1d2733; color: #fff; border: 1px solid #3a4a5a; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="real">（灰色のところ＝Questでは本物の部屋）</div>
  <div id="hud">
    🟩 <b>世界をはがす</b><br>
    最初は現実。真ん中に「everything around you is your creation」<br>
    <b>手をのばして空中をつまむ</b>（コントローラーはグリップ）→ 縦に亀裂が入り、手前に引くとドアのようにめくれて裏からコードが出る<br>
    つかんだまま元の所へ戻して離すと、元通りに閉じる／途中で離すとめくれたまま（先をつまみ直せる）<br>
    A / X ボタン … 全部閉じて現実にもどる<br>
    <small>パソコン：マウスでつかんで引く／矢印キーで見回す／Rでもどす</small>
  </div>
  <label id="hintOpt"><input type="checkbox" id="hintChk" checked> VRの中に「空中をつまんでめくって」の案内を出す</label>
  <button id="enter" disabled>しらべ中…</button>
  <button id="resetBtn">↺ もどす</button>

  <!-- three.js は vendor-three/（共有倉庫への分身）があればそれ、無ければCDN -->
  <script>
  (function () {
    var local = false;
    try {
      var x = new XMLHttpRequest();
      x.open("HEAD", "./vendor-three/three.module.js", false);
      x.send();
      local = x.status >= 200 && x.status < 400;
    } catch (e) {}
    var imports = local
      ? { "three": "./vendor-three/three.module.js" }
      : { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" };
    var s = document.createElement("script");
    s.type = "importmap";
    s.textContent = JSON.stringify({ imports: imports });
    document.currentScript.parentNode.insertBefore(s, document.currentScript.nextSibling);
  })();
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ================= 調整つまみ =================
    const R = 1.0;          // 現実の膜の半径 m（手が届く距離。膜そのものは透明）
    const R_CODE = 2.6;     // 奥にあるコードの世界の半径 m
    const SEG_W = 160, SEG_H = 80;
    const CRACK_H0 = 0.42, CRACK_HK = 0.8, CRACK_HMAX = 1.0; // 縦の亀裂の長さ m（めくれた幅に応じて伸びる）
    const CRACK_OPEN = 0.22; // つかんだ瞬間に亀裂が開く角度（rad）
    const CRACK_SEC = 0.22;  // 亀裂が走るのにかかる秒数
    const HEAL_SEC = 0.3;    // 閉じて亀裂が消えるまでの秒数
    const JAG = 0.022;       // 亀裂のギザギザ m（開くほど大きく）
    const LEN0 = 0.08, LEN_K = 0.45; // 亀裂から付け根までの幅 m ＝ LEN0 ＋ 手を引いた距離×LEN_K
    const CURL = 0.05;      // 付け根の丸まりの半径 m（大きいほどふんわり）
    const HAND_GAIN = 1.6;  // 手を動かした分×何倍めくれるか
    const REGRAB_ANGLE = 0.5, REGRAB_DIST = 0.25; // めくれの先端の近く（この角度か距離以内）をつまむと、その続きをつかむ
    const CLOSE_DIST = 0.12;  // ここまで戻して離すと、元通りに閉じる m
    const MAX_FLAPS = 6;
    const TITLE = 'everything around you is your creation';
    const RAIN_COLS = 160, RAIN_ROWS = 72;

    // ================= 基本 =================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000000, 0);   // 透明＝現実（パススルー）が見える
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.02, 100);
    camera.position.set(0, 1.5, 0);
    let yaw = 0, pitch = 0;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ================= コードの文字表（8×8＝64文字、映画と同じく左右反転） =================
    function makeGlyphAtlas() {
      const S = 512, cell = S / 8, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
      const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+<>';
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `bold ${cell * 0.78}px "Hiragino Kaku Gothic ProN", "MS Gothic", monospace`;
      for (let k = 0; k < 64; k++) {
        const x = (k % 8 + 0.5) * cell, y = (Math.floor(k / 8) + 0.5) * cell;
        g.save(); g.translate(x, y); g.scale(-1, 1); g.fillText(chars[k % chars.length], 0, 0); g.restore();
      }
      const t = new THREE.CanvasTexture(c);
      t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
      return t;
    }
    const shared = { atlas: { value: makeGlyphAtlas() }, uTime: { value: 0 } };

    // コードの雨（2つの材質で共通）
    const RAIN_GLSL = `
      uniform sampler2D atlas; uniform float uTime;
      const float COLS = ${RAIN_COLS}.0, ROWS = ${RAIN_ROWS}.0;
      float h1(float n) { return fract(sin(n * 127.1 + 3.7) * 43758.5453); }
      float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      vec2 stream(float col, float row, float seed) {
        float sp = 5.0 + h1(col * 1.31 + seed) * 16.0;
        float len = 6.0 + h1(col * 2.71 + seed) * 22.0;
        float period = ROWS + len + h1(col * 5.13 + seed) * 50.0;
        float headRow = mod(uTime * sp + h1(col + seed) * 300.0, period) - len * 0.5;
        float d = headRow - row;
        if (d < 0.0 || d > len) return vec2(0.0);
        return vec2(pow(1.0 - d / len, 1.6), d < 1.0 ? 1.0 : 0.0);
      }
      // uv の位置の「文字の色（文字の形で切り抜き済み）」
      vec3 rain(vec2 uv, bool flipU, float cols, float rows) {
        float u = flipU ? 1.0 - uv.x : uv.x;
        vec2 grid = vec2(u * cols, uv.y * rows);
        vec2 cell = floor(grid), f = fract(grid);
        float col = cell.x, row = rows - 1.0 - cell.y;
        float rate = 0.3 + h2(cell + 5.0) * 2.5;
        float idx = floor(h2(cell + floor(uTime * rate + h2(cell) * 10.0) * 0.618) * 64.0);
        vec2 fp = f * 0.84 + 0.08;
        float glyph = texture2D(atlas, vec2((mod(idx, 8.0) + fp.x) / 8.0, 1.0 - (floor(idx / 8.0) + 1.0 - fp.y) / 8.0)).r;
        vec2 a = stream(col, row, 0.0), b = stream(col, row, 41.0);
        vec3 g = vec3(0.1, 1.0, 0.35) * max(a.x, b.x) * 1.25 + vec3(0.8, 1.0, 0.85) * max(a.y, b.y);
        g += vec3(0.0, 0.055, 0.02);
        return g * glyph;
      }`;

    // ================= 奥：コードの世界（動かない。上は丸天井・下は床） =================
    function codeGeometry() {
      const eye = 1.5, floorY = -0.03;
      const geo = new THREE.SphereGeometry(R_CODE, 96, 48);
      const p = geo.attributes.position.array;
      for (let i = 0; i < p.length; i += 3) {
        const dx = p[i] / R_CODE, dy = p[i+1] / R_CODE, dz = p[i+2] / R_CODE;
        const r = dy < 0 ? Math.min(R_CODE, (eye - floorY) / -dy) : R_CODE;
        p[i] = dx * r; p[i+1] = eye + dy * r; p[i+2] = dz * r;
      }
      return geo;
    }
    const codeWorld = new THREE.Mesh(codeGeometry(), new THREE.ShaderMaterial({
      uniforms: shared,
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        precision highp float;
        ${RAIN_GLSL}
        varying vec2 vUv;
        void main() {
          gl_FragColor = vec4(vec3(0.0, 0.03, 0.01) + rain(vUv, true, COLS, ROWS), 1.0);
          #include <colorspace_fragment>
        }`,
      side: THREE.BackSide,
    }));
    codeWorld.renderOrder = 1;          // 現実の膜のあとに描く＝膜がある所ではコードは隠れる
    codeWorld.frustumCulled = false;
    scene.add(codeWorld);

    // ================= 手前：現実の膜（体のまわりの球。めくれる） =================
    const geo = new THREE.SphereGeometry(R, SEG_W, SEG_H);
    const N = geo.attributes.position.count;
    const base = new Float32Array(geo.attributes.position.array); // 中心(0,0,0)の形
    const rest = new Float32Array(N * 3);                         // 実際の場所（中心Cにずらしたもの）
    const pos = geo.attributes.position.array;
    geo.setAttribute('nRest', new THREE.BufferAttribute(new Float32Array(geo.attributes.normal.array), 3));
    geo.setAttribute('aIn', new THREE.BufferAttribute(new Float32Array(N), 1));   // めくれている所
    geo.setAttribute('aCut', new THREE.BufferAttribute(new Float32Array(N), 1));  // めくれ帯の横の切れ目
    geo.setAttribute('aEdge', new THREE.BufferAttribute(new Float32Array(N), 1)); // ふち（光る）
    const aIn = geo.attributes.aIn.array, aCut = geo.attributes.aCut.array, aEdge = geo.attributes.aEdge.array;

    // となりの点の組（ふちを見つけるため）
    const EA = [], EB = [];
    for (let iy = 0; iy <= SEG_H; iy++) for (let ix = 0; ix <= SEG_W; ix++) {
      const i = iy * (SEG_W + 1) + ix;
      if (ix < SEG_W) { EA.push(i); EB.push(i + 1); }
      if (iy < SEG_H) { EA.push(i); EB.push(i + SEG_W + 1); }
    }
    const NE = EA.length;

    const C = new THREE.Vector3(0, 1.5, 0); // 膜の中心（入った時の頭の位置）
    function recenter(p) {
      C.copy(p);
      for (let i = 0; i < N * 3; i += 3) { rest[i] = base[i] + C.x; rest[i+1] = base[i+1] + C.y; rest[i+2] = base[i+2] + C.z; }
      pos.set(rest);
      codeWorld.position.set(C.x, 0, C.z);
      dirty = true;
    }

    const clothMat = new THREE.ShaderMaterial({
      uniforms: shared,
      vertexShader: `
        attribute vec3 nRest; attribute float aIn; attribute float aCut; attribute float aEdge;
        varying vec2 vUv; varying vec3 vN; varying vec3 vNR; varying float vIn; varying float vCut; varying float vEdge;
        void main() {
          vUv = uv; vN = normal; vNR = nRest; vIn = aIn; vCut = aCut; vEdge = aEdge;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        precision highp float;
        ${RAIN_GLSL}
        varying vec2 vUv; varying vec3 vN; varying vec3 vNR; varying float vIn; varying float vCut; varying float vEdge;
        void main() {
          // 帯の横の切れ目をまたぐ三角形は描かない（付け根側はつながったまま）
          if (vIn > 0.001 && vCut > 0.001) discard;
          float k = abs(dot(normalize(vN), normalize(vNR)));   // 丸まり・折れの陰
          float e = pow(clamp(vEdge, 0.0, 1.0), 6.0);          // ふちの光
          vec3 glow = vec3(0.12, 1.0, 0.4);
          float flap = smoothstep(0.35, 0.65, vIn);
          vec3 rgb; float a;
          if (gl_FrontFacing) {
            // めくれて見えている裏側：現実はコードでできている
            vec3 g = rain(vUv, false, COLS * 0.625, ROWS * 0.625);
            rgb = vec3(0.0, 0.05, 0.02) + g * (0.45 + 0.55 * k);
            a = 0.95 * flap;
          } else {
            // 現実の側：透明（奥のコードを隠して、パススルーをそのまま見せる）。めくれた所は少し暗く透ける
            a = flap * (0.15 + (1.0 - k) * 0.35);
            rgb = vec3(0.0);
          }
          rgb = rgb * a + glow * e * 0.8;   // 前もって乗算（premultiplied）
          a = max(a, e * 0.8);
          gl_FragColor = vec4(rgb / max(a, 0.001), a);
          #include <colorspace_fragment>
          gl_FragColor.rgb *= a;
        }`,
      side: THREE.DoubleSide,
      // 不透明扱い＝色を混ぜずに書く。深度を書くので、膜の奥のコードは描かれない
    });
    const cloth = new THREE.Mesh(geo, clothMat);
    cloth.renderOrder = 0;
    cloth.frustumCulled = false;
    scene.add(cloth);

    // ================= めくれの計算 =================
    // 1つのめくれ：つまんだ膜の点 P0 から、付け根（ちょうつがい）までの帯が、付け根を軸に手 H の方へ起き上がる
    const flaps = [];
    let dirty = true;
    const V = () => new THREE.Vector3();
    const UP = new THREE.Vector3(0, 1, 0);

    // 亀裂とめくれの向きなどを決める（毎コマ）
    // 亀裂はつまんだ所に縦に入り、横のどちらかを付け根にしてドアのように手前へ開く
    function flapFrame(f) {
      const nIn = V().subVectors(C, f.P0).normalize();            // 膜から体へ向かう向き
      const d = V().subVectors(f.H, f.P0);
      const D = d.length();
      const h = V().crossVectors(UP, nIn);                         // 膜に沿った水平方向
      if (h.lengthSq() < 1e-4) h.set(1, 0, 0);
      h.normalize();
      if (!f.tLocked) {
        const sd = d.dot(h);
        if (Math.abs(sd) > 0.015) f.side = sd > 0 ? -1 : 1;        // 付け根は横に引いた向きの反対側
        if (D > 0.06) f.tLocked = true;                            // 向きが決まったら固定（ばたつかない）
      }
      const t = h.multiplyScalar(f.side);
      const v = V().crossVectors(t, nIn).normalize();              // 亀裂の向き（ほぼ縦）
      const L = LEN0 + D * LEN_K;
      const W = Math.min(CRACK_HMAX, CRACK_H0 + CRACK_HK * L) * f.crack;
      const hinge = V().copy(f.P0).addScaledVector(t, L);
      const q = V().subVectors(f.H, hinge);
      // 開く角度：手の方を向く角度と、手前に引いた深さぶん起き上がる角度の大きい方（引いたらすぐ開く）
      const depth = Math.max(0, q.dot(nIn));
      let phi = Math.max(Math.atan2(q.dot(nIn), -q.dot(t)), Math.asin(Math.min(1, depth / L)));
      phi = Math.min(Math.PI * 0.97, Math.max(CRACK_OPEN * f.crack, phi));
      f.phi = phi;
      return { nIn, t, v, L, W, hinge, phi };
    }

    // 付け根からの距離 r の点が、起き上がり角 phi でどこへ行くか（付け根は丸まる）→ [xは膜に沿って先端方向, yは体の方向]
    function bend(r, phi) {
      const arc = CURL * phi;
      if (r <= arc) { const th = r / CURL; return [CURL * Math.sin(th), CURL * (1 - Math.cos(th))]; }
      const rr = r - arc;
      return [CURL * Math.sin(phi) + rr * Math.cos(phi), CURL * (1 - Math.cos(phi)) + rr * Math.sin(phi)];
    }

    function applyFlaps() {
      aIn.fill(0); aCut.fill(0);
      pos.set(rest);
      for (const f of flaps) {
        const { nIn, t, v, L, W, hinge, phi } = flapFrame(f);
        const halfW = W / 2;
        if (halfW < 1e-3) { f.tip = f.P0.clone(); continue; }
        // 先端（つまんだ点）の今の位置＝もう一度つまむ時の目印
        const [tx, ty] = bend(L, phi);
        f.tip = V().copy(hinge).addScaledVector(t, -tx).addScaledVector(nIn, ty);
        const c = Math.cos(phi), sn = Math.sin(phi);
        for (let i = 0; i < N; i++) {
          const i3 = i * 3;
          const px = rest[i3] - f.P0.x, py = rest[i3+1] - f.P0.y, pz = rest[i3+2] - f.P0.z;
          const at = px * t.x + py * t.y + pz * t.z;          // つまんだ点から付け根方向への距離
          const lat = px * v.x + py * v.y + pz * v.z;
          const h0 = px * nIn.x + py * nIn.y + pz * nIn.z;     // 球の丸み分のずれ
          const u = Math.abs(lat) / halfW;
          // 亀裂のふちはギザギザ、上下の端は細くとがる
          const jag = JAG * Math.min(1, L / 0.2) * (0.6 * Math.sin(lat * 53 + f.seed) + 0.4 * Math.sin(lat * 131 + f.seed * 2.3));
          const inStrip = u < 1 && at >= jag && at < L * (1 - Math.pow(u, 6)) + 1e-4 && at < L;
          if (inStrip) {
            const [x, y] = bend(L - at, phi);
            const nx = hinge.x + v.x * lat - t.x * x + nIn.x * y + (nIn.x * c + t.x * sn) * h0;
            const ny = hinge.y + v.y * lat - t.y * x + nIn.y * y + (nIn.y * c + t.y * sn) * h0;
            const nz = hinge.z + v.z * lat - t.z * x + nIn.z * y + (nIn.z * c + t.z * sn) * h0;
            pos[i3]   += nx - rest[i3];
            pos[i3+1] += ny - rest[i3+1];
            pos[i3+2] += nz - rest[i3+2];
            aIn[i] = 1;
          } else if (at < L && at > -0.12 && Math.abs(lat) < halfW + 0.12) {
            aCut[i] = 1; // 帯のすぐ横・先＝切れ目（付け根の先はつながったまま）
          }
        }
      }
      // ふち：めくれている所とそうでない所の境目
      aEdge.fill(0);
      for (let e = 0; e < NE; e++) {
        const a = EA[e], b = EB[e];
        if (aIn[a] !== aIn[b]) { aEdge[a] = 1; aEdge[b] = 1; }
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aIn.needsUpdate = true;
      geo.attributes.aCut.needsUpdate = true;
      geo.attributes.aEdge.needsUpdate = true;
      geo.computeVertexNormals();
      geo.computeBoundingSphere();
    }

    // ================= つかむ・動かす・離す =================
    // slot: 0,1=左右の手/コントローラー 2=マウス。p=つまんでいる点
    const grabbing = [null, null, null];
    let grabbedOnce = false;

    function nearestFlap(p) {
      const dir = V().subVectors(p, C).normalize();
      let best = null, bestScore = 1e9;
      for (const f of flaps) {
        if (f.grab || f.closing) continue;
        const tip = f.tip || f.P0;
        const dist = tip.distanceTo(p);
        const ang = V().subVectors(tip, C).normalize().angleTo(dir);
        if (dist > REGRAB_DIST && ang > REGRAB_ANGLE) continue;
        const score = Math.min(dist / REGRAB_DIST, ang / REGRAB_ANGLE);
        if (score < bestScore) { bestScore = score; best = f; }
      }
      return best;
    }

    function grabStart(slot, p) {
      if (grabbing[slot]) return;
      const rel = V().subVectors(p, C);
      if (rel.length() < 0.15) return; // 体の真ん中すぎると向きが決まらない
      const dir = rel.normalize();
      let f = nearestFlap(p);
      if (!f) {
        const P0 = V().copy(C).addScaledVector(dir, R);
        f = { P0, H: P0.clone(), grab: null, closing: false, side: slot === 0 ? -1 : 1, tLocked: false, tip: P0.clone(),
              crack: 0, phi: 0, seed: Math.random() * 100 };
        sndCrack();
        flaps.push(f);
        if (flaps.length > MAX_FLAPS) {
          const old = flaps.findIndex(x => !x.grab && x !== f);
          if (old >= 0) flaps.splice(old, 1);
        }
      }
      f.grab = { slot, p0: p.clone(), H0: f.H.clone() };
      f.closing = false;
      grabbing[slot] = f;
      if (inputs[slot]) inputs[slot].glowPulse = 1;
      if (!grabbedOnce) { grabbedOnce = true; hideHint(); titleTarget = 0; }
    }

    function grabMove(slot, p) {
      const f = grabbing[slot];
      if (!f) return 0;
      const before = f.H.clone();
      f.H.copy(f.grab.H0).addScaledVector(V().subVectors(p, f.grab.p0), HAND_GAIN);
      // 膜の外には出さない
      const rel = V().subVectors(f.H, C);
      if (rel.length() > R * 0.995) f.H.copy(C).addScaledVector(rel.normalize(), R * 0.995);
      dirty = true;
      return before.distanceTo(f.H);
    }

    function grabEnd(slot) {
      const f = grabbing[slot];
      if (!f) return;
      f.grab = null;
      grabbing[slot] = null;
      if (f.P0.distanceTo(f.H) < CLOSE_DIST) { f.closing = true; sndHeal(); } // 元の所まで戻して離したら閉じる
    }

    function closeAll() {
      for (let s = 0; s < grabbing.length; s++) grabEnd(s);
      if (flaps.some(f => !f.closing)) sndHeal();
      for (const f of flaps) f.closing = true;
    }

    function updateClosing(dt) {
      for (let i = flaps.length - 1; i >= 0; i--) {
        const f = flaps[i];
        if (!f.closing) {
          if (f.crack < 1) { f.crack = Math.min(1, f.crack + dt / CRACK_SEC); dirty = true; } // 亀裂が走る
          continue;
        }
        f.H.lerp(f.P0, 1 - Math.exp(-dt * 12));
        f.crack = Math.max(0, f.crack - dt / HEAL_SEC);                                       // 亀裂がふさがる
        dirty = true;
        if (f.crack <= 0) flaps.splice(i, 1);
      }
    }

    // ================= 入力：手・コントローラー =================
    const inputs = [];
    // つかんだ時だけ、手にほとんど透明な光をうっすら出す
    const glowGeo = new THREE.SphereGeometry(0.04, 24, 16);
    function makeGlowMat() {
      return new THREE.ShaderMaterial({
        uniforms: { uAlpha: { value: 0 } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform float uAlpha; varying vec3 vN; varying vec3 vV;
          void main() { float fr = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0); float a = uAlpha * (0.25 + 0.75 * fr);
            gl_FragColor = vec4(vec3(0.8, 1.0, 0.9) * a, a); }`,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      });
    }
    for (let i = 0; i < 2; i++) {
      const ctrl = renderer.xr.getController(i);
      const grip = renderer.xr.getControllerGrip(i);
      const hand = renderer.xr.getHand(i);
      scene.add(ctrl); scene.add(grip); scene.add(hand);
      const glow = new THREE.Mesh(glowGeo, makeGlowMat());
      glow.renderOrder = 12; glow.visible = false; scene.add(glow);
      const info = { ctrl, grip, hand, glow, glowA: 0, glowPulse: 0, source: null, btnPrev: false, p: new THREE.Vector3() };
      ctrl.addEventListener('connected', e => { info.source = e.data; });
      ctrl.addEventListener('disconnected', () => { info.source = null; grabEnd(i); glow.visible = false; });
      const down = () => { audioOn(); if (pointOf(info)) grabStart(i, info.p); };
      const up = () => grabEnd(i);
      ctrl.addEventListener('selectstart', down); ctrl.addEventListener('selectend', up);
      ctrl.addEventListener('squeezestart', down); ctrl.addEventListener('squeezeend', up);
      hand.addEventListener('pinchstart', down); hand.addEventListener('pinchend', up); // 手のつまみ（念のため両方で拾う）
      inputs.push(info);
    }

    // つまんでいる点：手なら親指と人さし指の先の真ん中、コントローラーなら握りの位置
    function pointOf(info) {
      const src = info.source;
      if (!src) return false;
      if (src.hand) {
        const a = info.hand.joints && info.hand.joints['index-finger-tip'];
        const b = info.hand.joints && info.hand.joints['thumb-tip'];
        if (a && b) { info.p.addVectors(a.position, b.position).multiplyScalar(0.5); return true; }
      }
      if (info.grip.visible || src.gripSpace) { info.p.copy(info.grip.position); return true; }
      info.p.copy(info.ctrl.position);
      return true;
    }

    let rustle = 0;
    function updateInputs(dt) {
      for (let i = 0; i < inputs.length; i++) {
        const c = inputs[i];
        if (!renderer.xr.isPresenting || !pointOf(c)) { c.glow.visible = false; continue; }
        if (grabbing[i]) {
          const moved = grabMove(i, c.p);
          rustle = Math.max(rustle, moved * 30);
          const gp = c.source.gamepad;
          if (gp && gp.hapticActuators && gp.hapticActuators[0] && moved > 0.002) {
            try { gp.hapticActuators[0].pulse(Math.min(0.6, moved * 40), 20); } catch (e) {}

        }
        // 手のうっすら光：つかんだ瞬間にふわっと、つかんでいる間はごく薄く、離すと消える
        const target = grabbing[i] ? 0.06 + 0.14 * c.glowPulse : 0;
        c.glowPulse = Math.max(0, c.glowPulse - dt / 0.35);
        c.glowA += (target - c.glowA) * Math.min(1, dt * (target > c.glowA ? 25 : 8));
        c.glow.visible = c.glowA > 0.003;
        if (c.glow.visible) {
          c.glow.position.copy(c.p);
          c.glow.material.uniforms.uAlpha.value = c.glowA;
          c.glow.scale.setScalar(1 + 0.25 * c.glowPulse);
        }
        // A/X（4番）かB/Y（5番）で全部閉じる
        const gp = c.source.gamepad;
        if (gp && !c.source.hand) {
          const pressed = !!((gp.buttons[4] && gp.buttons[4].pressed) || (gp.buttons[5] && gp.buttons[5].pressed));
          if (pressed && !c.btnPrev) reset();
          c.btnPrev = pressed;
        }
      }
    }

    // ================= 入力：マウス（パソコン確認用） =================
    const mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster();
    let mouseStartDir = null;
    function mousePoint(e) {
      mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(mouse, camera);
      const dir = raycaster.ray.direction.clone();
      // マウスを動かした角度ぶん「手前に引いた」ことにする
      const pull = mouseStartDir ? Math.min(1, dir.angleTo(mouseStartDir) / 0.6) : 0;
      return V().copy(camera.position).addScaledVector(dir, 0.6 * (1 - 0.6 * pull));
    }
    renderer.domElement.addEventListener('pointerdown', e => {
      if (renderer.xr.isPresenting) return;
      audioOn();
      mouseStartDir = null;
      const p = mousePoint(e);
      mouseStartDir = raycaster.ray.direction.clone();
      grabStart(2, p);
      renderer.domElement.setPointerCapture(e.pointerId);

    const mouseUp = () => { grabEnd(2); mouseStartDir = null; };
    renderer.domElement.addEventListener('pointerup', mouseUp);
    renderer.domElement.addEventListener('pointercancel', mouseUp);
    const keys = {};
    addEventListener('keydown', e => { keys[e.key] = true; if (e.key === 'r' || e.key === 'R') reset(); });
    addEventListener('keyup', e => { keys[e.key] = false; });
    document.getElementById('resetBtn').onclick = () => reset();

    // ================= 音（全部その場で合成。音源ファイルなし） =================
    // BGM：暗いうなり＋脈打つベース＋キック＋電子のきらめき（ディレイ）／文字の電子音／布のサラサラ
    let audio = null;
    function audioOn() {
      if (audio) { audio.ctx.resume(); return; }
      try {
        const ctx = new AudioContext();
        const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
        const bgm = ctx.createGain(); bgm.gain.value = 0; bgm.connect(master);
        bgm.gain.setTargetAtTime(0.55, ctx.currentTime, 2.5);            // BGMはゆっくり立ち上がる
        const sfx = ctx.createGain(); sfx.gain.value = 0.6; sfx.connect(master);

        const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

        // うなり（D と A を少しずらした鋸波 → ゆっくり開閉するフィルター）
        const padF = ctx.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 380; padF.Q.value = 4;
        const padG = ctx.createGain(); padG.gain.value = 0.07; padF.connect(padG).connect(bgm);
        [73.42, 73.9, 110.0, 146.83].forEach(fr => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(padF); o.start(); });
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lfoG = ctx.createGain(); lfoG.gain.value = 260;
        lfo.connect(lfoG).connect(padF.frequency); lfo.start();

        // きらめき用のディレイ（付点8分で跳ね返る）
        const BPM = 96, beat = 60 / BPM;
        const delay = ctx.createDelay(2); delay.delayTime.value = beat * 0.75;
        const fb = ctx.createGain(); fb.gain.value = 0.45; const wet = ctx.createGain(); wet.gain.value = 0.5;
        delay.connect(fb).connect(delay); delay.connect(wet).connect(bgm);

        const bassNotes = [36.71, 36.71, 43.65, 36.71, 32.70, 36.71, 49.0, 43.65];  // D1 D1 F1 D1 C1 D1 G1 F1
        const sparkle = [587.3, 698.5, 880, 1046.5, 1174.7, 1396.9, 1760];            // Dマイナーの高い音
        let step = 0, nextT = ctx.currentTime + 0.1;
        function schedule() {

            const t = nextT, s8 = step % 8;

              o.type = 'square'; o.frequency.value = bassNotes[(step / 2) % 8] * 2;
              f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(120, t + 0.18);
              g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
              o.connect(f).connect(g).connect(bgm); o.start(t); o.stop(t + 0.25);
            }
            // キック（1拍目と3拍目）
            if (step % 8 === 0) {
              const o = ctx.createOscillator(), g = ctx.createGain();
              o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
              g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
              o.connect(g).connect(bgm); o.start(t); o.stop(t + 0.32);
            }
            // チッ（16分の裏）
            if (step % 2 === 1) {
              const n = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
              n.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
              g.gain.setValueAtTime(s8 === 5 ? 0.05 : 0.02, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
              n.connect(f).connect(g).connect(bgm); n.start(t, Math.random()); n.stop(t + 0.05);
            }
            // きらめき（ときどき、ランダムに）
            if (Math.random() < 0.22) {
              const o = ctx.createOscillator(), g = ctx.createGain();
              o.type = 'sine'; o.frequency.value = sparkle[Math.floor(Math.random() * sparkle.length)];
              g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
              o.connect(g); g.connect(delay); g.connect(bgm); o.start(t); o.stop(t + 0.15);
            }
            step++; nextT += beat / 4;
          }
        }
        setInterval(schedule, 25);

        // めくっている間のデジタルなうなり（開いた角度で音程、動かした速さで音量）
        const servo = ctx.createOscillator(); servo.type = 'sawtooth'; servo.frequency.value = 90;
        const servo2 = ctx.createOscillator(); servo2.type = 'square'; servo2.frequency.value = 181;
        const sf = ctx.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 900; sf.Q.value = 3;
        const gain = ctx.createGain(); gain.gain.value = 0;
        // ビットをつぶしたようなザラつき
        const crush = ctx.createWaveShaper();
        { const n = 1024, curve = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; curve[i] = Math.round(x * 6) / 6; } crush.curve = curve; }
        servo.connect(sf); servo2.connect(sf); sf.connect(crush).connect(gain).connect(sfx);
        servo.start(); servo2.start();

        audio = { ctx, gain, level: 0, sfx, bgm, noiseBuf, servo, servo2, sf };
      } catch (e) {}
    }

    // 文字の電子音
    function blip(freq, dur, vol, type = 'square') {
      if (!audio) return;
      const { ctx, sfx } = audio, t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(sfx); o.start(t); o.stop(t + dur + 0.02);
    }
    // デジタルのかけら（短い矩形波のチリッ）
    function grain(vol = 0.04) {
      if (!audio) return;
      const { ctx, sfx } = audio, t = ctx.currentTime + Math.random() * 0.02;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(300 + Math.random() * 4700, t);
      if (Math.random() < 0.5) o.frequency.exponentialRampToValueAtTime(100 + Math.random() * 400, t + 0.02);
      const dur = 0.008 + Math.random() * 0.025;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(sfx); o.start(t); o.stop(t + dur + 0.01);
    }
    // 亀裂が入る音：ビリッとした電気の走り＋ノイズの裂け目＋デジタルのかけら
    function sndCrack() {
      if (!audio) return;
      const { ctx, sfx, noiseBuf } = audio, t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
      f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 1.5;
      g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(f).connect(g).connect(sfx); o.start(t); o.stop(t + 0.25);
      const n = ctx.createBufferSource(), ng = ctx.createGain(), nf = ctx.createBiquadFilter();
      n.buffer = noiseBuf; nf.type = 'bandpass'; nf.Q.value = 2;
      nf.frequency.setValueAtTime(7000, t); nf.frequency.exponentialRampToValueAtTime(600, t + 0.15);
      ng.gain.setValueAtTime(0.18, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      n.connect(nf).connect(ng).connect(sfx); n.start(t, Math.random()); n.stop(t + 0.18);
      for (let k = 0; k < 10; k++) setTimeout(() => grain(0.05), k * 14);
    }
    // 閉じて元通りになる音：上がっていく電子音＋かけら
    function sndHeal() {
      if (!audio) return;
      const { ctx, sfx } = audio, t = ctx.currentTime;
      [1, 1.5].forEach((m, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = k ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(320 * m, t); o.frequency.exponentialRampToValueAtTime(1900 * m, t + 0.22);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o.connect(g).connect(sfx); o.start(t); o.stop(t + 0.32);
      });
      for (let k = 0; k < 6; k++) setTimeout(() => grain(0.03), 40 + k * 30);
    }
    const sndScramble = () => blip(1800 + Math.random() * 2600, 0.025, 0.035);                       // パラパラ
    const sndLock = i => { blip(880 + (i % 7) * 110, 0.07, 0.07, 'triangle'); blip(3200, 0.012, 0.05); }; // 1文字決まる
    function sndDone() {                                                                              // 全部出た
      if (!audio) return;
      const { ctx, sfx } = audio, t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.9);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(f).connect(g).connect(sfx); o.start(t); o.stop(t + 1.2);
    }

    // ================= 目の前に置く物 =================
    const head = new THREE.Vector3(0, 1.5, 0);
    function placeInFront(obj, dist, dy) {
      const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      const p = V(), q = V().set(0, 0, -1);
      cam.getWorldPosition(p); q.applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion())); q.y = 0; q.normalize();
      obj.position.copy(p).addScaledVector(q, dist); obj.position.y = p.y + dy;
      obj.lookAt(p.x, obj.position.y, p.z);
      obj.visible = true;
    }

    function makeHint(text) {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(0,12,4,.85)'; g.beginPath(); g.roundRect(8, 8, 1008, 240, 40); g.fill();
      g.fillStyle = '#5dff8f'; g.font = 'bold 56px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const lines = text.split('\n');
      lines.forEach((l, i) => g.fillText(l, 512, 128 + (i - (lines.length - 1) / 2) * 76));
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;

    }
    const hint = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.1),
      new THREE.MeshBasicMaterial({ map: makeHint('手をのばして空中をつまみ\n手前にめくってみて'), transparent: true, depthTest: false }));
    hint.renderOrder = 10; hint.visible = false; scene.add(hint);
    function hideHint() { hint.visible = false; }
    // 案内を出すかどうか（入る前に選ぶ。次に開いた時も覚えておく）
    const hintChk = document.getElementById('hintChk');
    try { const saved = localStorage.getItem('peel-hint'); if (saved !== null) hintChk.checked = saved === '1'; } catch (e) {}
    hintChk.addEventListener('change', () => { try { localStorage.setItem('peel-hint', hintChk.checked ? '1' : '0'); } catch (e) {} });

    // ================= 真ん中の言葉（1文字ずつコードがパラパラ変わって確定する） =================
    const titleCanvas = document.createElement('canvas'); titleCanvas.width = 2048; titleCanvas.height = 180;
    const tg = titleCanvas.getContext('2d');
    const titleTex = new THREE.CanvasTexture(titleCanvas); titleTex.colorSpace = THREE.SRGBColorSpace;
    const titleMat = new THREE.MeshBasicMaterial({ map: titleTex, transparent: true, depthTest: false, opacity: 0 });
    const title = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0 * 180 / 2048), titleMat);
    title.renderOrder = 11; title.visible = false; scene.add(title);
    const SCRAMBLE = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
    const T_START = 0.6, T_PER = 0.06, T_SETTLE = 0.35;
    const TYPING_END = T_START + TITLE.length * T_PER + T_SETTLE;
    let titleT = 0, titleTarget = 0, titlePlaced = false, titleDone = false, lockedCount = 0, scrambleTick = 0, doneSounded = false;

    function startTitle() {
      titleT = 0; titleTarget = 1; titlePlaced = false; titleDone = false; lockedCount = 0; doneSounded = false; scrambleTick = 0;
      titleMat.opacity = 1; title.visible = false;
    }
    function drawTitle() {
      const W = titleCanvas.width, H = titleCanvas.height;
      tg.clearRect(0, 0, W, H);
      tg.font = 'bold 76px "Courier New", Menlo, monospace';
      tg.textAlign = 'center'; tg.textBaseline = 'middle';
      const cw = W * 0.92 / TITLE.length, x0 = (W - cw * TITLE.length) / 2;
      let last = -1, locked = 0, anySettling = false;
      for (let i = 0; i < TITLE.length; i++) {
        const ti = titleT - T_START - i * T_PER;
        if (ti < 0) break;
        last = i;
        if (ti >= T_SETTLE) locked = i + 1;
        if (TITLE[i] === ' ') continue;
        const settling = ti < T_SETTLE;
        if (settling) anySettling = true;
        const ch = settling ? SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)] : TITLE[i];
        tg.shadowColor = '#22ff66'; tg.shadowBlur = settling ? 28 : 16;
        tg.fillStyle = settling ? '#e6fff0' : '#6dff9c';
        tg.fillText(ch, x0 + cw * (i + 0.5), H / 2);
      }
      // 音：パラパラ中は細かい電子音、1文字決まるたびにピッ、全部出たらドゥン
      if (anySettling && titleT > scrambleTick) { sndScramble(); scrambleTick = titleT + 0.045; }
      while (lockedCount < locked) { if (TITLE[lockedCount] !== ' ') sndLock(lockedCount); lockedCount++; }
      if (!doneSounded && locked === TITLE.length) { doneSounded = true; sndDone(); }
      if (Math.floor(titleT * 2.5) % 2 === 0) {
        tg.shadowBlur = 16; tg.fillStyle = '#6dff9c';
        tg.fillRect(x0 + cw * (last + 1) + cw * 0.15, H / 2 - 34, cw * 0.7, 68);
      }
      titleTex.needsUpdate = true;
    }
    function updateTitle(dt) {
      if (titleTarget === 0 && titleMat.opacity <= 0) { title.visible = false; return; }
      titleT += dt;
      if (!titlePlaced && titleT > 0.15) { titlePlaced = true; placeInFront(title, 0.8, 0.02); }
      if (!titleDone) { drawTitle(); if (titleT > TYPING_END + 3) titleDone = true; }
      titleMat.opacity += Math.sign(titleTarget - titleMat.opacity) * Math.min(Math.abs(titleTarget - titleMat.opacity), dt / 0.6);
      if (hintChk.checked && renderer.xr.isPresenting && !grabbedOnce && !hint.visible && titleT > TYPING_END + 0.8) placeInFront(hint, 0.75, -0.16);
    }

    // ================= もどす =================
    let pendingRecenter = false;
    function reset() {
      closeAll();
      hideHint();
      pendingRecenter = true;
      grabbedOnce = false;
    }

    // ================= 入口ボタン =================
    const enterBtn = document.getElementById('enter');
    let xrMode = null;
    (async () => {
      if (!navigator.xr) { enterBtn.textContent = 'Questのブラウザで開くと入れる（ここではマウスで試せる）'; return; }
      if (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) xrMode = 'immersive-ar';
      else if (await navigator.xr.isSessionSupported('immersive-vr').catch(() => false)) xrMode = 'immersive-vr';
      if (!xrMode) { enterBtn.textContent = 'この機械はVR/ARに入れない（マウスで試せる）'; return; }
      enterBtn.disabled = false;
      enterBtn.textContent = xrMode === 'immersive-ar' ? '▶ 入る' : '▶ 入る（VR：現実は黒く見える）';
    })();
    let enterFrames = -1;
    enterBtn.onclick = async () => {
      audioOn();
      const session = await navigator.xr.requestSession(xrMode, { optionalFeatures: ['local-floor', 'hand-tracking'] });
      renderer.xr.setSession(session);
      enterFrames = 0;
      enterBtn.style.display = 'none'; document.getElementById('hintOpt').style.display = 'none';
      session.addEventListener('end', () => { enterBtn.style.display = ''; document.getElementById('hintOpt').style.display = ''; hideHint(); });
    };

    // ================= ループ =================
    recenter(C);
    startTitle();
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.1)));
    function frame(dt) {
      if (!renderer.xr.isPresenting) {
        if (keys.ArrowLeft) yaw += dt * 1.5;
        if (keys.ArrowRight) yaw -= dt * 1.5;
        if (keys.ArrowUp) pitch = Math.min(1.4, pitch + dt * 1.2);
        if (keys.ArrowDown) pitch = Math.max(-1.4, pitch - dt * 1.2);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
        head.copy(camera.position);
      } else {
        renderer.xr.getCamera().getWorldPosition(head);
      }
      // 入った直後（頭の位置が取れてから）に、膜を頭のまわりに置き直す
      if (enterFrames >= 0 && renderer.xr.isPresenting && ++enterFrames > 2) {
        enterFrames = -1; flaps.length = 0; recenter(head); startTitle(); grabbedOnce = false;
      }
      if (pendingRecenter && flaps.length === 0) {
        pendingRecenter = false;
        recenter(renderer.xr.isPresenting ? head : C);
        startTitle();
      }

      shared.uTime.value += dt;
      updateTitle(dt);
      updateInputs(dt);
      updateClosing(dt);
      if (dirty) { applyFlaps(); dirty = false; }

      if (audio) {
        // めくっている間：うなりの音量は動かした速さ、音程は開いた角度。速く動かすほどチリチリ増える
        let phi = 0;
        for (const f of flaps) if (f.grab) phi = Math.max(phi, f.phi || 0);
        const target = Math.min(0.14, rustle * 0.08);
        audio.level += (target - audio.level) * (target > audio.level ? 0.5 : 0.12);
        audio.gain.gain.value = audio.level;
        const now = audio.ctx.currentTime;
        audio.servo.frequency.setTargetAtTime(70 + phi * 150, now, 0.03);
        audio.servo2.frequency.setTargetAtTime(141 + phi * 310, now, 0.03);
        audio.sf.frequency.setTargetAtTime(600 + phi * 1400, now, 0.05);
        if (Math.random() < Math.min(0.9, rustle * 0.5)) grain(0.035);
        rustle *= 0.6;
      }

      renderer.render(scene, camera);
    }

    // 動作確認用
    window.__peel = { get audio() { return audio; }, startTitle, frame, setView(y, p) { yaw = y; pitch = p; }, grabStart, grabMove, grabEnd, reset, flaps, C,
      V: (x, y, z) => new THREE.Vector3(x, y, z) };
  </script>
</body>
</html>
